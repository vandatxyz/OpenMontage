# OpenMontage Film Factory Studio — public TLS + Basic Auth on :8463
# Backlot board lives on :8464 (see nginx-openmontage-backlot-8464.conf)
server {
    listen 0.0.0.0:8463 ssl;
    listen [::]:8463 ssl;
    server_name _;

    ssl_certificate     /root/.openclaw/certs/openclaw-dashboard.crt;
    ssl_certificate_key /root/.openclaw/certs/openclaw-dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32M;

    location / {
        auth_basic "openmontage";
        auth_basic_user_file /etc/nginx/.htpasswd-muse;

        proxy_pass http://127.0.0.1:4751;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
